camera_stream_node:
  ros__parameters:
    stream.destination_host: 192.168.1.69

    profiles.normal.bitrate: 8000
    profiles.normal.width: 1280
    profiles.normal.height: 720
    profiles.normal.fps: 30
    profiles.normal.format: MJPG
    profiles.normal.encoder: h265  # Options: av1, h265 (GUI receives H265 RTP over UDP)

    profiles.zed.bitrate: 12000
    profiles.zed.width: 1920
    profiles.zed.height: 1080
    profiles.zed.fps: 30
    profiles.zed.format: NV12
    profiles.zed.encoder: h265  # Options: av1, h265 (GUI receives H265 RTP over UDP)

    profiles.gimbal.bitrate: 8000
    profiles.gimbal.width: 1920
    profiles.gimbal.height: 1080
    profiles.gimbal.fps: 30
    profiles.gimbal.format: MJPG  # OBSBOT only offers YUYV up to 640x480
    profiles.gimbal.encoder: h265  # Options: av1, h265 (GUI receives H265 RTP over UDP)

    # FPV 1920x1080
    profiles.fpv_1080p.bitrate: 8000
    profiles.fpv_1080p.width: 1920
    profiles.fpv_1080p.height: 1080
    profiles.fpv_1080p.fps: 30
    profiles.fpv_1080p.format: MJPG
    profiles.fpv_1080p.encoder: h265

